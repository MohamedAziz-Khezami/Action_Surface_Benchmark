# ──────────────────────────────────────────────────────────────────────
# TASK TYPE: log_note_on_each_open_deal   (hard tier)
#
# WHAT THE MODEL IS ASKED (example):
#   "Log a note with the subject 'quarterly review' on every open deal owned
#    by Grace Silva. Report how many you logged as n_logged."
#
# WHAT IT TESTS:
#   Iteration over a group with a CREATE per item — the model must find all
#   of one rep's open deals and log one activity on each. Distinct from the
#   update-each templates: the per-item action adds a row rather than
#   changing one. Missing a deal, or logging on a closed one, fails the
#   exact added-count check.
#
# HOW IT'S MADE VALID:
#   The group size is DECIDED first (n_deals) and exactly that many OPEN
#   deals are planted under a reserved rep. The rep's closed deals are
#   clutter that must NOT receive a note. Background deals never belong to
#   the reserved rep, so the group is closed by construction. The subject is
#   quoted verbatim in the query, so the model never has to invent text the
#   verifier checks exactly.
# ──────────────────────────────────────────────────────────────────────
name: log_note_on_each_open_deal
pattern: iterate_over_set
answer_keys: [n_logged]
n_functions: "1 + n_deals"   # find the open deals + one log per deal
n_actions: "{n_deals}"

# ── 1. dice rolls ────────────────────────────────────────────────────────
params:
  rep_name: {draw: person_name}
  contact_name: {draw: person_name}
  company: {draw: company}
  n_deals: {choice: [2, 3, 4]}
  n_clutter: {randint: [1, 2]}
  subject: {choice: [quarterly review, touch base, renewal check, status update]}

# ── 2. rows planted into the world ─────────────────────────────────────
kernel:
  - {ref: the_rep, table: reps, row: {name: "{rep_name}"}}
  - {ref: the_contact, table: contacts, row: {name: "{contact_name}", company: "{company}"}}
  # the group that must each get a note: the rep's open deals
  - {ref: open_leads, table: leads, repeat: "{n_deals}", row: {contact_id: "@the_contact"}}
  - {ref: open_deals, table: deals, repeat: "{n_deals}",
     row: {lead_id: "@open_leads", rep_id: "@the_rep",
           stage: {choice: [prospecting, qualification, proposal, negotiation, closing]}}}
  # clutter: closed deals that must NOT receive a note
  - {ref: clutter_leads, table: leads, repeat: "{n_clutter}", row: {contact_id: "@the_contact"}}
  - {ref: clutter_deals, table: deals, repeat: "{n_clutter}",
     row: {lead_id: "@clutter_leads", rep_id: "@the_rep", stage: {choice: [won, lost]}}}

# ── 3. what a correct solution must have changed: a note on each open deal ─
effects:
  - for_each: open_deals
    added:
      - {table: activities, row: {deal_id: "@item", type: note, subject: "{subject}"}}

# ── 4. the correct answer ──────────────────────────────────────────────
answer: {n_logged: "{n_deals}"}

# ── 5. the query (fixed form) ──────────────────────────────────────────
query: >-
  Log a note with the subject '{subject}' on every open deal owned by
  {rep_name}. Report how many you logged as n_logged.
