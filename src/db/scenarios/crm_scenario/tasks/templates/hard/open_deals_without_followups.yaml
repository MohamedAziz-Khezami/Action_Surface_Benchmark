# ──────────────────────────────────────────────────────────────────────
# TASK TYPE: open_deals_without_followups   (hard tier — read-only)
#
# WHAT THE MODEL IS ASKED (example):
#   "How many of Grace Silva's open deals have no follow-up scheduled? Report
#    the count as n_bare."
#
# WHAT IT TESTS:
#   A per-item ABSENCE check combined with a stage filter — a two-table
#   anti-join no tool expresses. The model must find the rep's open deals
#   and, for each, check whether any follow-up exists, counting only the ones
#   with none. Open deals that DO have a follow-up, and closed deals, are
#   excluded.
#
# HOW IT'S MADE VALID:
#   The bare count is DECIDED first (n_bare). Exactly that many open deals are
#   planted with no follow-up, alongside open deals that each carry one (with
#   a follow-up) and closed clutter deals. Background deals never belong to
#   the reserved rep, so the rep's open-deal set is closed.
# ──────────────────────────────────────────────────────────────────────
name: open_deals_without_followups
pattern: single_query_aggregate
answer_keys: [n_bare]
n_functions: 3      # find the rep's open deals + check each for follow-ups + count
n_actions: 0

# ── 1. dice rolls ────────────────────────────────────────────────────────
params:
  rep_name: {draw: person_name}
  contact_name: {draw: person_name}
  company: {draw: company}
  n_bare: {randint: [2, 4]}     # open, no follow-up -> counted
  n_with: {randint: [1, 3]}     # open, has a follow-up -> excluded
  n_closed: {randint: [1, 2]}   # closed -> excluded

# ── 2. rows planted into the world ─────────────────────────────────────
kernel:
  - {ref: the_rep, table: reps, row: {name: "{rep_name}"}}
  - {ref: the_contact, table: contacts, row: {name: "{contact_name}", company: "{company}"}}
  # bare: open deals with NO follow-up
  - {ref: bare_leads, table: leads, repeat: "{n_bare}", row: {contact_id: "@the_contact"}}
  - {ref: bare_deals, table: deals, repeat: "{n_bare}",
     row: {lead_id: "@bare_leads", rep_id: "@the_rep",
           stage: {choice: [prospecting, qualification, proposal, negotiation, closing]}}}
  # with: open deals that each carry one follow-up -> excluded
  - {ref: with_leads, table: leads, repeat: "{n_with}", row: {contact_id: "@the_contact"}}
  - {ref: with_deals, table: deals, repeat: "{n_with}",
     row: {lead_id: "@with_leads", rep_id: "@the_rep",
           stage: {choice: [prospecting, qualification, proposal, negotiation, closing]}}}
  - {ref: the_followups, table: followups, repeat: "{n_with}",
     row: {deal_id: "@with_deals", status: open}}
  # closed clutter -> excluded
  - {ref: closed_leads, table: leads, repeat: "{n_closed}", row: {contact_id: "@the_contact"}}
  - {ref: closed_deals, table: deals, repeat: "{n_closed}",
     row: {lead_id: "@closed_leads", rep_id: "@the_rep", stage: {choice: [won, lost]}}}

# ── 3. what a correct solution must have changed: NOTHING (read-only) ──
effects: {}

# ── 4. the correct answer ──────────────────────────────────────────────
answer: {n_bare: "{n_bare}"}

# ── 5. the query (fixed form) ──────────────────────────────────────────
query: >-
  How many of {rep_name}'s open deals have no follow-up scheduled? Report the
  count as n_bare.
