# registry of models to benchmark.
#
# Optional per-model pricing (USD per 1M tokens) feeds the cost metrics:
#   price_in_per_mtok:  <float>   # prompt tokens
#   price_out_per_mtok: <float>   # completion tokens
# Omit both for an unpriced model — the run still records token counts and
# sandbox-compute cost, but leaves the dollar cost blank (cost_priced=0) rather
# than reporting a misleading $0. The locals below are unpriced: to place them
# on the same axis as API models, fill these with each model's measured
# GPU-hour cost per Mtok. The sandbox second's price lives in config.py
# (SANDBOX_USD_PER_SECOND).
models:
  # ── llama.cpp ───────────────────────────────────────────────────
  - name: gemma4-12b-llamacpp-local
    backend: openai_compatible
    model_id: unsloth/gemma-4-12b-it-GGUF:gemma-4-12b-it-BF16.gguf
    base_url: http://localhost:8083/v1
    api_key_env: null
    supports_tool_calling: true

